<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Файл с пробелом</title>
</head>
<body>
    <h1>✅ URL декодирование работает!</h1>
    <p>Этот файл имеет пробел в имени: <code>test file.html</code></p>
    <p>URL запрос был: <code>/test%20file.html</code></p>
    <p>Если видите эту страницу, значит percent-encoding обрабатывается правильно!</p>
    <a href="/">← Назад на главную</a>
</body>
</html>
